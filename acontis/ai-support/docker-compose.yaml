# Bring-up: Qdrant + support-rag. Run LiteLLM (or your LLM gateway) separately and set RAG_LLM_GATEWAY__BASE_URL.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # resource limits for dev — tune in real deployments
    mem_limit: 2g

  support-rag:
    build: .
    ports:
      - "8080:8080"
    environment:
      RAG_CONFIG: /app/config.yaml
      RAG_QDRANT__URL: http://qdrant:6333
      RAG_LLM_GATEWAY__BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:4000}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-dev-service}
      RAG_ADMIN_TOKEN: ${RAG_ADMIN_TOKEN:-dev-admin}
    volumes:
      # `cp config.example.yaml config.yaml` and edit before `docker compose up`
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - qdrant

volumes:
  qdrant_data: {}
