# E2E / Ollama profile for local gateway + support_rag (not for default dev).
# All-local runbook (no Docker): see docs/runbook-allow-remote-false-e2e.md
# Testing: LOCAL Ollama only — no cloud providers in the LiteLLM model_list.
# Default stack:  LiteLLM :4000  |  support_rag :8080  |  Qdrant :6333
# Copy: cp config.e2e.example.yaml config.e2e.yaml
# Use:  set RAG_CONFIG=config.e2e.yaml
#
# Ollama:  ollama serve   |   ollama pull all-minilm   |   ollama pull llama3.2:1b
# LiteLLM: pip install; route JSON model "embedding" -> all-minilm, "retrieval" -> llama3.2:1b
#          (see docs/litellm-ollama-e2e.example.yaml). X-Slot headers are for PRD R-15/R-16; simplest
#          setup routes by `model` only — you do not need to configure LiteLLM on X-Slot.
# llm_gateway.base_url -> LiteLLM (must match litellm --port). Override: RAG_LLM_GATEWAY__BASE_URL
# ollama_embed_*: direct Ollama /api/embed for dense vectors; chat still uses base_url. Optional for E2E.
#
# Ollama's all-minilm is typically 384-d — qdrant.vector_size matches below.
# If your runtime returns a different length, set vector_size to that length
# and use a distinct collection_prefix so you do not mix vector widths.

service:
  bind: 0.0.0.0:8080
  service_token_env: RAG_SERVICE_TOKEN
  admin_token_env: RAG_ADMIN_TOKEN
  version: 0.1.0
  langfuse_header_name: "x-langfuse-trace-id"

llm_gateway:
  base_url: http://127.0.0.1:4000
  ollama_embed_base_url: http://127.0.0.1:11434
  ollama_embed_model: all-minilm
  ollama_embed_truncate_chars: 512
  # If LiteLLM uses general_settings.master_key, set the same: env RAG_LLM_GATEWAY__API_KEY
  api_key: ""
  timeout_s: 120
  embedding_slot: embedding
  retrieval_slot: retrieval_llm
  chat_slot: chat_llm
  chat_model: chat
  # Labels for /rag/health; must match the Ollama models used behind the gateway.
  display_models:
    embedding: all-minilm
    retrieval_llm: llama3.2:1b
    chat: llama3.2:1b

qdrant:
  url: http://127.0.0.1:6333
  collection_prefix: support_rag_e2e_
  vector_size: 384
  distance: cosine

retrieval:
  hybrid: true
  rerank_enabled: true
  top_k_dense: 30
  top_k_sparse: 30
  top_k_final: 6
  fusion: rrf
  rrf_k: 60
  query_rewrite:
    enabled: true
    n_alternatives: 3
  hyde:
    enabled: false
  reranker:
    model: BAAI/bge-reranker-v2-m3
    device: cpu

chunking:
  kb:
    strategy: sentence_window
    chunk_size: 512
    window_size: 3
  tickets:
    strategy: qa_pair

chunker_version:
  kb: kb-v1
  tickets: tickets-v1

observability:
  otel_endpoint: ""
  service_name: support-rag

# Optional: AnythingLLM (see config.example.yaml). E2E runbooks may use a local Desktop on :3001.
# anything_llm:
#   base_url: http://127.0.0.1:3001
#   api_key: ""
#   workspace_slug: ""  # first workspace from ALM API; or set an explicit slug
#   score_threshold: 0.25
#   top_n: 4
#   timeout_s: 60

# Browser UI: field defaults; the running app may append updates to this file.
web_ui:
  folder_path: ""
  namespace: kb
  use_rag: false
  message_draft: ""
  anythingllm_models_source: alm_desktop
  chat_model_source: llm_gateway
  anythingllm_completion: gateway
  show_retrieval_context: true
  top_k: 6
  anythingllm_top_n: 4
  anythingllm_score_threshold: null
  anythingllm_workspace_slug_override: ""
  retrieval_chunk_char_cap: 12000
  anythingllm_ingest_state_path: "var/anythingllm_ingest_state.json"
