# Copy to config.yaml and adjust. Override with env vars prefixed RAG_ (e.g. RAG_LLM_GATEWAY__BASE_URL).

service:
  bind: 0.0.0.0:8080
  service_token_env: RAG_SERVICE_TOKEN
  admin_token_env: RAG_ADMIN_TOKEN
  version: 0.1.0
  # Langfuse: forwarded when present on incoming HTTP headers
  langfuse_header_name: "x-langfuse-trace-id"

llm_gateway:
  base_url: http://127.0.0.1:4000
  # Optional: direct Ollama /api/embed (bypasses LiteLLM; leave empty to use only base_url)
  ollama_embed_base_url: ""
  ollama_embed_model: ""
  timeout_s: 30
  embedding_slot: embedding
  retrieval_slot: retrieval_llm
  # Optional: separate X-Slot / JSON model for Web UI chat (defaults match retrieval if omitted)
  # chat_slot: retrieval_llm
  # chat_model: retrieval
  # Optional static labels for /rag/health when /v1/models is unavailable
  display_models:
    embedding: ""
    retrieval_llm: ""
    chat: ""

qdrant:
  url: http://127.0.0.1:6333
  collection_prefix: support_rag_
  vector_size: 1024
  distance: cosine

retrieval:
  hybrid: true
  # Exposed in /rag/health capabilities.rerank; retrieve still uses per-request `rerank`
  rerank_enabled: true
  top_k_dense: 30
  top_k_sparse: 30
  top_k_final: 6
  fusion: rrf
  rrf_k: 60
  query_rewrite:
    enabled: true
    n_alternatives: 3
  hyde:
    enabled: false
  reranker:
    model: BAAI/bge-reranker-v2-m3
    device: cpu

chunking:
  kb:
    strategy: sentence_window
    # Token budget per segment: SentenceSplitter + SentenceWindowNodeParser (PRD ~512-token windows)
    chunk_size: 512
    window_size: 3
  tickets:
    strategy: qa_pair

# Bump when chunking/embedding contract changes; included in chunk id hash
chunker_version:
  kb: kb-v2
  tickets: tickets-v1

observability:
  otel_endpoint: ""
  service_name: support-rag
  # gRPC for OTLP (empty = no export)

# Optional: AnythingLLM (Desktop or server) for dual-RAG. Prefer env: RAG_ANYTHING_LLM__API_KEY, RAG_ANYTHING_LLM__BASE_URL.
# anything_llm:
#   base_url: http://127.0.0.1:3001
#   api_key: ""
#   workspace_slug: ""  # or a specific slug; empty uses first workspace from AnythingLLM
#   score_threshold: 0.25
#   top_n: 4
#   timeout_s: 60

# Optional web UI defaults (incl. dual-RAG toggles) — same keys are persisted under `web_ui` when set from the form.
# web_ui:
#   anythingllm_models_source: alm_desktop
#   chat_model_source: llm_gateway
#   anythingllm_completion: gateway
#   show_retrieval_context: true
#   top_k: 6
#   anythingllm_top_n: 4
#   anythingllm_score_threshold: null
#   anythingllm_workspace_slug_override: ""
#   retrieval_chunk_char_cap: 12000
#   anythingllm_ingest_state_path: "var/anythingllm_ingest_state.json"
